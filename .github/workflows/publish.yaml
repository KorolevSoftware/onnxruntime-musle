name: Build and publish musl libraries

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [onnxruntime-release-updated]

permissions:
  contents: read

concurrency:
  group: publish-onnxruntime-musl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-24.04
    outputs:
      ort_version: ${{ steps.version.outputs.ort_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          source onnxruntime.env
          echo "ort_version=$ORT_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            alpine_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            alpine_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install --yes ca-certificates curl tar

      - name: Build ONNX Runtime in Alpine/musl chroot
        run: ./scripts/build-ort-musl.sh '${{ matrix.arch }}' '${{ matrix.alpine_arch }}'

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: onnxruntime-linux-${{ matrix.arch }}
          path: artifacts/onnxruntime-${{ needs.prepare-version.outputs.ort_version }}-linux-${{ matrix.arch }}-musl.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    needs: [prepare-version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download both architecture archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: onnxruntime-linux-*
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORT_VERSION: ${{ needs.prepare-version.outputs.ort_version }}
        run: |
          tag="onnxruntime-v${ORT_VERSION}"
          assets=(release-assets/*.tar.gz)
          if [ ! -f "${assets[0]}" ] || [ "${#assets[@]}" -ne 2 ]; then
            echo "Expected exactly two architecture archives; found ${#assets[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "ONNX Runtime ${ORT_VERSION} for Alpine/musl" \
              --target "$GITHUB_SHA" \
              --notes "Alpine/musl ONNX Runtime ${ORT_VERSION} shared libraries for linux/amd64 and linux/arm64. Each archive includes licenses, build metadata, and SHA256SUMS."
          fi

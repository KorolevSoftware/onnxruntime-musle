name: Check ONNX Runtime release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-onnxruntime-release
  cancel-in-progress: false

jobs:
  update-pin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install --yes ca-certificates curl

      - name: Update pin to latest stable release
        id: update
        run: |
          ./scripts/update-ort-version.sh latest
          if git diff --quiet -- onnxruntime.env; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          source onnxruntime.env
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add onnxruntime.env
          git commit -m "Update ONNX Runtime pin to ${ORT_VERSION}"
          git push

      - name: Trigger native library builds
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=onnxruntime-release-updated
